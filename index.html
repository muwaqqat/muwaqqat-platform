<body>
  <h1>مُوَقَّت</h1>

  <h2>منصة مُوَقَّتة</h2>

  <p>
    فشِراكُ الشبكة العنكبوتية الواهية كثيرة،
    ولا أريدك أن تخوض في خيوطها وحبائلها لتصل إلينا؛
    إنه سلاحٌ على رقبتك، وليس سلاحًا ذا حدين.
  </p>

  <p>
    أسأل الله أن يبصّرنا بالحق، ويجنّبنا الفتن...
  </p>
